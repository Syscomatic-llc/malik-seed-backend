services:
  postgres:
    image: postgres:17
    container_name: malikseed-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-malikseed}
      POSTGRES_USER: ${POSTGRES_USER:-malikseed}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password123}

    expose:
      - "5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

    networks:
      malik-seed-network:
        aliases:
          - postgres

  backend:
    build: .
    container_name: malik-seed-backend
    restart: unless-stopped

    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-malikseed}:${POSTGRES_PASSWORD:-password123}@malikseed-postgres:5432/${POSTGRES_DB:-malikseed}
      SECRET_KEY: ${SECRET_KEY:-change-this-secret-key-before-production}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-1440}
      UPLOAD_DIR: /app/uploads
      MAX_FILE_SIZE: ${MAX_FILE_SIZE:-10485760}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      FROM_EMAIL: ${FROM_EMAIL:-noreply@malikseed.com}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@malikseed.com}
      FIRST_ADMIN_EMAIL: ${FIRST_ADMIN_EMAIL:-admin@malikseed.com}
      FIRST_ADMIN_PASSWORD: ${FIRST_ADMIN_PASSWORD:-admin123}

    ports:
      - "9000:8000"

    volumes:
      - ./uploads:/app/uploads

    depends_on:
      postgres:
        condition: service_healthy

    links:
      - postgres:postgres
      - postgres:malikseed-postgres

    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

    networks:
      - malik-seed-network

  frontend:
    build:
      context: ./atlantis-ng-21.0.0
      dockerfile: Dockerfile
      args:
        API_BASE_URL: https://apimalikseed.syscomatic.cloud/api/v1
        MEDIA_BASE_URL: https://apimalikseed.syscomatic.cloud/

    container_name: malik-seed-frontend

    restart: unless-stopped

    ports:
      - "6500:80"

    depends_on:
      backend:
        condition: service_healthy

    networks:
      - malik-seed-network

volumes:
  postgres_data:

networks:
  malik-seed-network:
    name: malik-seed-network
    driver: bridge
